title: Luna Lunapiena - Web Developer
author: Luna Lunapiena
url: "lunacodesdesign.com"
# baseurl: "jekyll_test/"
email: luna@lunacodesdesign.com
description: > # this means to ignore newlines until "show_excerpts:"
  Luna Lunapiena is a friendly and enthusiastic Web Developer, who works primarily with WordPress and Jekyll.

show_excerpts: false # set to true to show excerpts on the homepage

github_url: https://github.com/lunacodes/
twitter_url: https://mobile.twitter.com/lunacodess

# SEO - jekyll-seo-tag
# logo: "/header.png"
twitter:
  - username: lunacodess
  - card: summary
social:
  name: Luna Lunapiena
  links:
    - https://twitter.com/lunacodess
    - https://githuub.com/lunacodes
locale: en_US
# google_site_verification:

show_excerpts: false # set to true to show excerpts on the homepage
excerpt_separator: <!--more-->

kramdown:
  toc_levels: 2..3

permalink: /:categories/:year/:month/:day/:title/

collections_dir: collections
collections:
  projects:
    output: true
    permalink: /portfolio/:name/
    redirect_from: /projects/:name/
    order:
      - haSepharadi.md
      - living-poetry.md
      - us-corr.md
      - eye-to-eye.md
      - jess-dobkin.md
      - five-pillars.md
      - jay-michaels.md
      - laura-mcdonald.md
      - wandering-cellist.md
      # - arvados.md
      # - cwl.md
      # - curii.md

defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project-single"

plugins:
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-titles-from-headings
  - jekyll-webp

exclude:
  - assets/img/_bak/
  - _bak/
  - _archive/
  - _scratch/

sass:
  sass_dir: _sass
  # style: compressed

titles_from_headings:
  enabled: true
  strip_title: true
  collections: false

############################################################
# Site configuration for the WebP Generator Plugin
webp:
  enabled: true

  # The quality of the webp conversion 0 to 100 (where 100 is least lossy)
  quality: 75

  # List of directories containing images to optimize, nested directories will only be checked if `nested` is true
  # By default the generator will search for a folder called `/img` under the site root and process all jpg, png and tiff image files found there.
  img_dir: ["assets/img/"]

  # Whether to search in nested directories or not
  nested: true

  # add ".gif" to the format list to generate webp for animated gifs as well
  formats: [".jpeg", ".jpg", ".png", ".tiff"]

  # File extensions for animated gif files
  gifs: [".gif"]

  # Set to true to always regenerate existing webp files
  regenerate: false

  # Local path to the WebP utilities to use (relative or absolute)
  # Omit or leave as nil to use the utilities shipped with the gem, override only to use your local install
  # Eg : "/usr/local/bin/cwebp"
  webp_path: nil

  # List of files or directories to exclude
  # e.g. custom or hand generated webp conversion files
  exclude: ["_bak/"]

  # append '.webp' to filename after original extension rather than replacing it.
  # Default transforms `image.png` to `image.webp`, while changing to true transforms `image.png` to `image.png.webp`
  append_ext: false
############################################################
